<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta charset="UTF-8" />
		<title>Tweakpane plugin</title>
		<style>
			body {
				background: black;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import * as Tweakpane from 'tweakpane'
			import * as TweakpanePluginInputs from '/src/index.ts'

			const params = {
				rangeStepInput: 2,
				numberStepInput: 2,
				radiogrid: 25,
				dots: 8.5,
				interval: { min: -10, max: 10 },
				stepper: 1.5,
			}

			const pane = new Tweakpane.Pane()

			pane.registerPlugin(TweakpanePluginInputs)

			pane
				.addBinding(params, 'stepper', {
					view: 'stepper',
					format: (v) => `${v}!`,
					label: 'Value',
					min: -5,
					max: 10,
					step: 0.5,
				})
				.on('change', (newValue) => {
					updateStepperVal(newValue.value)
				})

			window.pane = pane

			function updateStepperVal(v) {
				console.log(v)
			}
		</script>
	</body>
</html>
